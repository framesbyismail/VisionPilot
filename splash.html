<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VisionPilot — Loading</title>
<style>
  :root {
    --bg: #181a1f;
    --panel: #21242b;
    --line: #2f333d;
    --fg: #f1f3f8;
    --muted: #98a0b0;
    --green: #22c55e;
    --green-dark: #16a34a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--fg);
  }
  .splash-card {
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 18%, rgba(34, 197, 94, 0.14), transparent 62%), var(--bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 28px;
    gap: 20px;
    position: relative;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
  }
  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .logo-wrap img, .logo-wrap svg {
    height: 52px;
    width: auto;
    filter: drop-shadow(0 6px 18px rgba(232, 93, 43, 0.25));
  }
  .tagline {
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .bar-wrap {
    width: 82%;
    max-width: 320px;
    height: 6px;
    background: #121418;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    width: 42%;
    border-radius: 999px;
    background: linear-gradient(90deg, #16a34a 0%, #4ade80 50%, #16a34a 100%);
    background-size: 200% 100%;
    animation: splash-slide 1.5s ease-in-out infinite, splash-grad 2.4s linear infinite;
  }
  @keyframes splash-slide {
    0%   { transform: translateX(-85%); width: 38%; }
    50%  { transform: translateX(95%);  width: 52%; }
    100% { transform: translateX(250%); width: 38%; }
  }
  @keyframes splash-grad {
    0%   { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  .status-line {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    text-align: center;
    min-height: 18px;
  }
  .ver-badge {
    position: absolute;
    bottom: 12px;
    right: 16px;
    font-size: 10.5px;
    font-weight: 600;
    color: #697080;
  }
</style>
</head>
<body>
  <div class="splash-card">
    <div class="logo-wrap">
      <img src="logo/visionpilot-logo-dark.svg" alt="VisionPilot">
      <div class="tagline">Become an AI Director</div>
    </div>
    <div class="bar-wrap" role="progressbar" aria-label="Loading VisionPilot">
      <div class="bar-fill" id="splashBar"></div>
    </div>
    <div class="status-line" id="splashStatus">Checking for updates on GitHub…</div>
    <span class="ver-badge" id="splashVer">v1.0.0</span>
  </div>
  <script>
    if (window.visionPilotDesktop && typeof window.visionPilotDesktop.onUpdateStatus === 'function') {
      window.visionPilotDesktop.onUpdateStatus(msg => {
        const el = document.getElementById('splashStatus');
        if (el && msg) el.textContent = msg;
      });
    }
  </script>
</body>
</html>
