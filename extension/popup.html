<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VisionPilot AI Bridge</title>
<style>
  body {
    margin: 0; padding: 14px; width: 290px;
    background: #161616; color: #e8e4df;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif; font-size: 12.5px;
  }
  .head {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 10px; border-bottom: 1px solid #333; margin-bottom: 10px;
  }
  .head b { font-size: 14px; color: #e85d2b; letter-spacing: -.01em; }
  .badge {
    font-family: monospace; font-size: 10px; padding: 2px 7px;
    border-radius: 99px; background: rgba(63,185,80,.16);
    color: #3fb950; border: 1px solid #3fb950;
  }
  p { margin: 0 0 10px; color: #a8a4a0; line-height: 1.45; }
  .models { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .m-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; border-radius: 7px; background: #1e1e1e; border: 1px solid #333;
  }
  .m-row span { font-weight: 600; }
  .m-row a {
    color: #e85d2b; text-decoration: none; font-size: 11px; font-weight: 600;
  }
  .m-row a:hover { text-decoration: underline; }
  .foot { font-size: 11px; color: #858585; text-align: center; padding-top: 6px; border-top: 1px solid #292929; }
</style>
</head>
<body>
  <div class="head">
    <b>VisionPilot AI Bridge</b>
    <span class="badge">● ACTIVE</span>
  </div>
  <p>Select <b>VisionPilot AI</b>, <b>Claude</b>, <b>GPT</b>, or <b>Gemini</b> from the top <b>AI Model</b> button inside VisionPilot.</p>
  <div class="models">
    <div class="m-row"><span>Claude (Anthropic)</span><a href="https://claude.ai" target="_blank" rel="noopener">Open claude.ai ↗</a></div>
    <div class="m-row"><span>GPT (ChatGPT)</span><a href="https://chatgpt.com" target="_blank" rel="noopener">Open chatgpt.com ↗</a></div>
    <div class="m-row"><span>Gemini (Google)</span><a href="https://gemini.google.com" target="_blank" rel="noopener">Open gemini.google.com ↗</a></div>
  </div>
  <div class="foot">1 Extension · Works with Free &amp; Paid AI Accounts</div>
  <script src="popup.js"></script>
</body>
</html>
