<!doctype html>
<html lang="en" data-mode="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VisionPilot — Ad Box (4:3)</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #16181d;
    --line: #2e323b;
    --fg: #f1f3f8;
    --muted: #98a0b0;
    --accent: #e85d2b;
    --purple: #8b5cf6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .ad-standalone-wrap {
    width: min(640px, 100%);
  }
  .vp-ad-shell {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }
  .vp-ad-viewport {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 12px;
    overflow: hidden;
    border: 1.5px solid var(--line);
    background: #111318;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.65);
    user-select: none;
  }
  .vp-ad-track {
    display: flex;
    width: 100%;
    height: 100%;
    transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }
  .vp-ad-slide {
    flex: 0 0 100%;
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }
  .vp-ad-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .vp-ad-caption {
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 14px;
    padding: 10px 14px;
    border-radius: 9px;
    background: rgba(10, 12, 16, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .vp-ad-badge {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .vp-ad-title {
    font-size: 13.5px;
    font-weight: 700;
    color: #ffffff;
  }
  .vp-ad-pause-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.04);
    color: #e8e4df;
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }
  .vp-ad-pause-btn:hover,
  .vp-ad-pause-btn.paused {
    border-color: var(--accent);
    color: #ffffff;
    box-shadow: 0 0 12px rgba(232, 93, 43, 0.45);
  }
  .vp-ad-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .vp-ad-dots {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    touch-action: none;
    cursor: pointer;
  }
  .vp-ad-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 0;
    background: transparent;
    display: grid;
    place-items: center;
    cursor: pointer;
    padding: 0;
  }
  .vp-ad-dot-core {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.32);
    transition: transform 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
  }
  .vp-ad-dot:hover .vp-ad-dot-core {
    background: rgba(255, 255, 255, 0.7);
    box-shadow: 0 0 8px rgba(232, 93, 43, 0.6);
  }
  .vp-ad-dot.active .vp-ad-dot-core {
    background: var(--accent);
    transform: scale(1.32);
    box-shadow: 0 0 12px var(--accent), 0 0 22px rgba(232, 93, 43, 0.65);
  }
</style>
</head>
<body>
  <div class="ad-standalone-wrap" id="vpStandaloneAd" data-vp-ad-carousel></div>
  <script src="ads.js"></script>
</body>
</html>
