<!doctype html>
<html lang="en" data-mode="night" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VisionPilot — Image Carousel (4:3)</title>
<style>
  :root {
    --bg: #0c0d10;
    --panel: #15171c;
    --line: #262930;
    --edge: #323640;
    --fg: #eef0f5;
    --muted: #8a8f9c;
    --accent: #e85d2b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .ad-standalone-wrap {
    width: min(640px, 100%);
  }
  .vp-ad-shell {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }
  .vp-ad-viewport {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--edge);
    background: #111318;
    user-select: none;
  }
  .vp-ad-track {
    display: flex;
    width: 100%;
    height: 100%;
    transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }
  .vp-ad-slide {
    flex: 0 0 100%;
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }
  .vp-ad-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .vp-ad-controls {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .vp-ad-dots {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 6px 14px;
    border-radius: 999px;
    background: #111318;
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .vp-ad-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 0;
    background: transparent;
    display: grid;
    place-items: center;
    cursor: pointer;
    padding: 0;
  }
  .vp-ad-dot-core {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4b5262;
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .vp-ad-dot:hover .vp-ad-dot-core {
    background: #9ca3af;
  }
  .vp-ad-dot.active .vp-ad-dot-core {
    background: var(--accent);
    transform: scale(1.25);
  }
  .vp-ad-dot.locked .vp-ad-dot-core {
    background: var(--accent);
    transform: scale(1.35);
    box-shadow: 0 0 0 2px #ffffff;
  }
</style>
</head>
<body>
  <div class="ad-standalone-wrap" id="vpStandaloneAd" data-vp-ad-carousel></div>
  <script src="ads.js"></script>
</body>
</html>
